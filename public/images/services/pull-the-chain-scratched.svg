<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">Pull the chain scratched lettering</title>
  <desc id="desc">Irregular hand-carved lettering designed to resemble scratched writing on a wall.</desc>

  <defs>
    <filter id="roughCut" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.055" numOctaves="3" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="innerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset dx="-2" dy="-3"/>
      <feGaussianBlur stdDeviation="2.2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.82" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <mask id="chipped">
      <rect width="100%" height="100%" fill="white"/>
      <g fill="black" opacity="0.9">
        <rect x="48" y="79" width="24" height="8" transform="rotate(-11 48 79)"/>
        <rect x="150" y="126" width="17" height="7" transform="rotate(13 150 126)"/>
        <rect x="250" y="72" width="20" height="7" transform="rotate(-9 250 72)"/>
        <rect x="74" y="238" width="18" height="8" transform="rotate(8 74 238)"/>
        <rect x="206" y="248" width="26" height="7" transform="rotate(-7 206 248)"/>
        <rect x="289" y="214" width="18" height="8" transform="rotate(10 289 214)"/>
        <rect x="92" y="398" width="28" height="8" transform="rotate(-12 92 398)"/>
        <rect x="226" y="427" width="21" height="7" transform="rotate(9 226 427)"/>
      </g>
    </mask>
  </defs>

  <g
    fill="none"
    stroke="#1b110a"
    stroke-width="18"
    stroke-linecap="square"
    stroke-linejoin="miter"
    filter="url(#roughCut)"
    mask="url(#chipped)"
    opacity="0.94"
  >
    <!-- PULL -->
    <path d="M52 48 L48 166 M49 52 L108 49 Q139 50 139 82 Q138 113 107 114 L51 114"/>
    <path d="M165 50 L164 131 Q165 164 197 164 Q228 164 230 130 L230 48"/>
    <path d="M255 49 L254 163 L322 164"/>
    <path d="M341 47 L340 163 L397 162"/>

    <!-- THE -->
    <path d="M43 210 L139 208 M90 210 L88 329"/>
    <path d="M164 209 L161 329 M163 265 L229 266 M231 208 L229 329"/>
    <path d="M258 208 L258 329 M260 211 L339 209 M258 267 L325 266 M258 327 L344 329"/>

    <!-- CHAIN -->
    <path d="M113 379 Q90 350 61 370 Q34 389 39 429 Q44 470 76 479 Q108 486 126 459"/>
    <path d="M148 360 L145 481 M146 419 L214 419 M216 359 L214 482"/>
    <path d="M238 482 L276 359 L319 482 M251 441 L307 441"/>
    <path d="M339 359 L337 481"/>
    <path d="M368 481 L367 359 L417 481 L418 359"/>
  </g>

  <!-- subtle exposed-edge highlight -->
  <g
    fill="none"
    stroke="#b79b78"
    stroke-width="4"
    stroke-linecap="square"
    stroke-linejoin="miter"
    opacity="0.26"
    transform="translate(3 3)"
    filter="url(#roughCut)"
    mask="url(#chipped)"
  >
    <path d="M52 48 L48 166 M49 52 L108 49 Q139 50 139 82 Q138 113 107 114 L51 114"/>
    <path d="M165 50 L164 131 Q165 164 197 164 Q228 164 230 130 L230 48"/>
    <path d="M255 49 L254 163 L322 164"/>
    <path d="M341 47 L340 163 L397 162"/>
    <path d="M43 210 L139 208 M90 210 L88 329"/>
    <path d="M164 209 L161 329 M163 265 L229 266 M231 208 L229 329"/>
    <path d="M258 208 L258 329 M260 211 L339 209 M258 267 L325 266 M258 327 L344 329"/>
    <path d="M113 379 Q90 350 61 370 Q34 389 39 429 Q44 470 76 479 Q108 486 126 459"/>
    <path d="M148 360 L145 481 M146 419 L214 419 M216 359 L214 482"/>
    <path d="M238 482 L276 359 L319 482 M251 441 L307 441"/>
    <path d="M339 359 L337 481"/>
    <path d="M368 481 L367 359 L417 481 L418 359"/>
  </g>
</svg>
